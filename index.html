<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roller Coaster Designer</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #101827; color: #f3f6fc; font: 1rem/1.5 system-ui, sans-serif; }
  main { max-width: 1080px; margin: auto; padding: clamp(16px, 4vw, 48px); }
  h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 3rem); letter-spacing: -.04em; }
  h2 { margin: 0 0 .75rem; font-size: 1.1rem; }
  p { color: #bfcde2; margin: .5rem 0 1.5rem; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(225px, .36fr); gap: 16px; }
  section, aside { background: #182439; border: 1px solid #34455f; border-radius: 16px; padding: clamp(12px, 3vw, 24px); min-width: 0; }
  .plots { margin-top: 16px; }
  canvas { display: block; width: 100%; background: #111c2e; border-radius: 8px; }
  #track { height: clamp(235px, 38vw, 390px); touch-action: none; cursor: grab; }
  #track.dragging { cursor: grabbing; }
  label { display: block; margin: 0 0 4px; }
  select { width: 100%; min-height: 44px; margin-bottom: 12px; padding: 0 8px; border-radius: 8px; border: 1px solid #51627b; background: #263750; color: inherit; font: inherit; }
  .plots canvas { height: 165px; }
  .plots h2:not(:first-child) { margin-top: 1rem; }
  .controls { display: flex; gap: 8px; }
  button { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #51627b; background: #263750; color: #d5deeb; font: inherit; }
  dl { margin: 1.25rem 0 0; }
  dt { color: #bfcde2; }
  dd { margin: 0 0 1rem; font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  dd:last-child { margin-bottom: 0; }
  @media (max-width: 680px) { .layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Roller Coaster Designer</h1>
  <p>Drag the three points to shape the track.</p>

  <div class="layout">
    <section aria-labelledby="track-title">
      <h2 id="track-title">Track editor</h2>
      <canvas id="track" aria-label="Side view of the track with three draggable points."></canvas>
    </section>
    <aside aria-labelledby="ride-title">
      <h2 id="ride-title">Ride controls</h2>
      <label for="preset">Track preset</label>
      <select id="preset">
        <option value="starter">Starter</option>
        <option value="rollback">Rollback hill</option>
        <option value="highG">High-g valley</option>
        <option value="custom" disabled hidden>Custom</option>
      </select>
      <div class="controls">
        <button type="button" disabled>Ride</button>
        <button type="button" disabled>Reset</button>
      </div>
      <dl>
        <dt>Starter speed at start</dt>
        <dd>0.00 mph</dd>
        <dt>Starter rider load at start</dt>
        <dd>0.71 g</dd>
        <dt>Starter sample at valley</dt>
        <dd>31.33 mph · 2.00 g</dd>
      </dl>
    </aside>
  </div>

  <section class="plots" aria-label="Sample plots">
    <p>Sample plots for the starter track</p>
    <h2>Speed (mph)</h2>
    <canvas id="speed" role="img" aria-label="Sample speed increases to 31.33 miles per hour at the valley, then decreases."></canvas>
    <h2>Rider load (g)</h2>
    <canvas id="load" role="img" aria-label="Sample rider load peaks at 2 g, with limits marked at positive 4 g and negative 1 g."></canvas>
  </section>
</main>
<script>
  const presets = {
    starter: [[0, 10], [20, 0], [30, 2.5]],
    rollback: [[0, 10], [20, 0], [45, 15.625]],
    highG: [[0, 10], [10, 0], [15, 2.5]]
  };
  const trackCanvas = document.getElementById('track');
  const preset = document.getElementById('preset');
  let points = presets.starter.map(point => [...point]);
  let trackChart;
  let drag;
  // The plots retain the starter samples until the physics stage.
  const distances = [0, 6.65, 12.55, 17.90, 22.96, 28.01, 33.36];
  const speeds = [0, 20.72, 27.14, 30.34, 31.33, 30.34, 27.14];
  const loads = [0.71, 1.02, 1.43, 1.83, 2.00, 1.83, 1.43];
  const cyan = '#56e4df';
  const amber = '#ffbd74';

  function prepareChart(id, xMax, yMin, yMax, xTicks, yTicks, axisLabel) {
    const canvas = document.getElementById(id);
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    const density = window.devicePixelRatio || 1;
    canvas.width = Math.round(width * density);
    canvas.height = Math.round(height * density);
    const ctx = canvas.getContext('2d');
    ctx.scale(density, density);

    const left = 42;
    const right = width - 23;
    const top = 16;
    const bottom = height - 47;
    const x = value => left + (right - left) * value / xMax;
    const y = value => bottom - (bottom - top) * (value - yMin) / (yMax - yMin);
    ctx.font = '13px system-ui';
    ctx.fillStyle = '#bfcde2';
    ctx.strokeStyle = '#34455f';
    ctx.beginPath();
    ctx.textAlign = 'right';
    for (const tick of yTicks) {
      ctx.moveTo(left, y(tick));
      ctx.lineTo(right, y(tick));
      ctx.fillText(tick, left - 8, y(tick) + 4);
    }
    ctx.textAlign = 'center';
    for (const tick of xTicks) {
      ctx.moveTo(x(tick), top);
      ctx.lineTo(x(tick), bottom);
      ctx.fillText(tick, x(tick), bottom + 17);
    }
    ctx.stroke();
    ctx.fillText(axisLabel, (left + right) / 2, height - 8);
    return { ctx, x, y };
  }

  function trackSlopes() {
    const [[x0, h0], [x1, h1], [x2, h2]] = points;
    const firstSlope = (h1 - h0) / (x1 - x0);
    const secondSlope = (h2 - h1) / (x2 - x1);
    const quadratic = (secondSlope - firstSlope) / (x2 - x0);
    return points.map(([x]) => firstSlope + quadratic * (2 * x - x0 - x1));
  }

  function drawTrack() {
    trackChart = prepareChart('track', 200, 0, 60,
      [0, 50, 100, 150, 200], [0, 15, 30, 45, 60], 'Horizontal distance (m)');
    const { ctx, x, y } = trackChart;
    const slopes = trackSlopes();
    const [startX, startHeight] = points[0];
    ctx.strokeStyle = cyan;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(x(startX), y(startHeight));
    for (let i = 0; i < points.length - 1; i++) {
      const [x0, h0] = points[i];
      const [x1, h1] = points[i + 1];
      const span = (x1 - x0) / 3;
      ctx.bezierCurveTo(x(x0 + span), y(h0 + slopes[i] * span),
        x(x1 - span), y(h1 - slopes[i + 1] * span), x(x1), y(h1));
    }
    ctx.stroke();

    for (const [position, height] of points) {
      ctx.beginPath();
      ctx.arc(x(position), y(height), 7, 0, 2 * Math.PI);
      ctx.fillStyle = '#111c2e';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    const tangent = Math.atan2(y(startHeight + slopes[0]) - y(startHeight), x(1) - x(0));
    ctx.save();
    ctx.translate(x(startX), y(startHeight));
    ctx.rotate(tangent);
    ctx.fillStyle = amber;
    ctx.fillRect(-11, -17, 22, 11);
    ctx.fillStyle = '#f3f6fc';
    for (const wheel of [-6, 6]) {
      ctx.beginPath();
      ctx.arc(wheel, -5, 2.5, 0, 2 * Math.PI);
      ctx.fill();
    }
    ctx.restore();
  }

  function pointerPosition(event) {
    const bounds = trackCanvas.getBoundingClientRect();
    return [event.clientX - bounds.left, event.clientY - bounds.top];
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  trackCanvas.addEventListener('pointerdown', event => {
    if (drag || event.button !== 0) return;
    const [pointerX, pointerY] = pointerPosition(event);
    const { x, y } = trackChart;
    const distances = points.map(([px, height]) => Math.hypot(pointerX - x(px), pointerY - y(height)));
    const closest = Math.min(...distances);
    if (closest > 22) return;
    const index = distances.indexOf(closest);
    const [px, height] = points[index];
    drag = { index, pointerId: event.pointerId, offsetX: pointerX - x(px), offsetY: pointerY - y(height) };
    trackCanvas.setPointerCapture(event.pointerId);
    trackCanvas.classList.add('dragging');
  });

  trackCanvas.addEventListener('pointermove', event => {
    if (drag?.pointerId !== event.pointerId) return;
    const { index, offsetX, offsetY } = drag;
    const [pointerX, pointerY] = pointerPosition(event);
    const { x, y } = trackChart;
    const minX = index === 0 ? 0 : points[index - 1][0] + 1;
    const maxX = index === points.length - 1 ? 200 : points[index + 1][0] - 1;
    const minHeight = index === 0 ? points[1][1] + 0.01 : 0;
    const maxHeight = index === 1 ? points[0][1] - 0.01 : 60;
    points[index] = [
      clamp((pointerX - offsetX - x(0)) / (x(1) - x(0)), minX, maxX),
      clamp((pointerY - offsetY - y(0)) / (y(1) - y(0)), minHeight, maxHeight)
    ];
    preset.value = 'custom';
    drawTrack();
  });

  trackCanvas.addEventListener('lostpointercapture', event => {
    if (drag?.pointerId !== event.pointerId) return;
    drag = undefined;
    trackCanvas.classList.remove('dragging');
  });

  preset.addEventListener('change', () => {
    if (drag) trackCanvas.releasePointerCapture(drag.pointerId);
    points = presets[preset.value].map(point => [...point]);
    drawTrack();
  });

  function drawPlot(id, values, yMin, yMax, ticks, color, limits = []) {
    const { ctx, x, y } = prepareChart(id, 34, yMin, yMax,
      [0, 10, 20, 30], ticks, 'Distance along track (m)');
    ctx.strokeStyle = '#ff8f91';
    ctx.setLineDash([5, 4]);
    for (const limit of limits) {
      ctx.beginPath();
      ctx.moveTo(x(0), y(limit));
      ctx.lineTo(x(34), y(limit));
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(x(0), y(values[0]));
    for (let i = 1; i < values.length; i++) {
      ctx.lineTo(x(distances[i]), y(values[i]));
    }
    ctx.lineWidth = 3;
    ctx.strokeStyle = color;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(x(0), y(values[0]), 4, 0, 2 * Math.PI);
    ctx.fillStyle = color;
    ctx.fill();
  }

  function render() {
    drawTrack();
    drawPlot('speed', speeds, -2, 35, [0, 10, 20, 30], cyan);
    drawPlot('load', loads, -1.5, 4.5, [-1, 0, 2, 4], amber, [-1, 4]);
  }

  render();
  window.addEventListener('resize', render);
</script>
</body>
</html>
